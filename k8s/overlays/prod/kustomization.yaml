apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../../base

# ============================================================
# PATCH GENÉRICO: aplica revisionHistoryLimit a TODOS os Deployments
# ============================================================

# ============================================================
# PATCHES INDIVIDUAIS: replicas específicas por serviço
# ============================================================




patches:
- patch: |-
    - op: add
      path: /spec/revisionHistoryLimit
      value: 2
  target:
    kind: Deployment
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 1
  target:
    kind: Deployment
    name: auth-service
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 2          # <-- pode ser diferente para cada serviço
  target:
    kind: Deployment
    name: flag-service
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 1
  target:
    kind: Deployment
    name: targeting-service
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 3          # <-- evaluation pode ter mais réplicas
  target:
    kind: Deployment
    name: evaluation-service
- patch: |-
    - op: replace
      path: /spec/replicas
      value: 1
  target:
    kind: Deployment
    name: analytics-service

# ============================================================
# IMAGENS
# ============================================================
images:
- name: analytics-service
  newName: 136035252239.dkr.ecr.us-east-1.amazonaws.com/analytics-service
  newTag: 241a0521df083287ec08fd0de1002ba678bc141d
- name: auth-service
