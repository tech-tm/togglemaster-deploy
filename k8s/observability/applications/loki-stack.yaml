apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: loki-stack
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://grafana.github.io/helm-charts
    chart: loki-stack
    targetRevision: 2.10.2
    helm:
      releaseName: loki-stack
      values: |
        # ----------------------------------------------------------------
        # Loki: centraliza e indexa os logs de todos os conteineres.
        # Modo single-binary com storage local (suficiente para o lab;
        # para producao usar object storage S3).
        # ----------------------------------------------------------------
        loki:
          enabled: true
          persistence:
            enabled: false
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              memory: 512Mi

        # ----------------------------------------------------------------
        # Promtail: roda como DaemonSet e envia os logs de cada pod do
        # cluster para o Loki.
        # ----------------------------------------------------------------
        promtail:
          enabled: true
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi

        # Grafana proprio do loki-stack desativado: usamos o do
        # kube-prometheus-stack como ferramenta unica de visualizacao.
        grafana:
          enabled: false
        prometheus:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: observability
  # Ignora campos de .status adicionados no k8s 1.33+ que a lib do
  # ArgoCD (gitops-engine) ainda nao conhece. Defensa local complementar
  # ao resource.customizations.ignoreDifferences no argocd-cm.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /status/terminatingReplicas
    - group: apps
      kind: StatefulSet
      jsonPointers:
        - /status/terminatingReplicas
    - group: apps
      kind: ReplicaSet
      jsonPointers:
        - /status/terminatingReplicas
    - group: apps
      kind: DaemonSet
      jsonPointers:
        - /status/terminatingReplicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
