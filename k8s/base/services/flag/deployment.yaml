apiVersion: apps/v1
kind: Deployment
metadata:
  name: flag-service
  labels:
    app: flag
spec:
  replicas: 1
  selector:
    matchLabels:
      app: flag
  template:
    metadata:
      labels:
        app: flag
    spec:
      containers:
      - name: flag-service
        image: flag-service
        imagePullPolicy: Always
        ports:
        - containerPort: 8002
        livenessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 15
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8002
          initialDelaySeconds: 5
          periodSeconds: 5
        env:
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: db-flag-secret
              key: username
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-flag-secret
              key: password
        - name: RDS_FLAG_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: togglemaster-config
              key: RDS_FLAG_ENDPOINT
        - name: DATABASE_URL
          value: postgres://$(POSTGRES_USER):$(POSTGRES_PASSWORD)@$(RDS_FLAG_ENDPOINT):5432/flags_db
        - name: AUTH_SERVICE_URL
          value: "http://auth-service:8001"
        # ---------- OpenTelemetry (Fase 4 - Bloco 3) ----------
        - name: OTEL_SERVICE_NAME
          value: "flag-service"
        - name: OTEL_EXPORTER_OTLP_ENDPOINT
          valueFrom:
            configMapKeyRef:
              name: togglemaster-config
              key: OTEL_EXPORTER_OTLP_ENDPOINT
        - name: OTEL_EXPORTER_OTLP_PROTOCOL
          valueFrom:
            configMapKeyRef:
              name: togglemaster-config
              key: OTEL_EXPORTER_OTLP_PROTOCOL
        - name: OTEL_RESOURCE_ATTRIBUTES
          valueFrom:
            configMapKeyRef:
              name: togglemaster-config
              key: OTEL_RESOURCE_ATTRIBUTES
        - name: OTEL_LOGS_EXPORTER
          value: "otlp"
        - name: OTEL_PYTHON_LOG_CORRELATION
          value: "true"
        # ------------------------------------------------------
        - name: PORT
          value: "8002"
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 250m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: flag-service
spec:
  type: ClusterIP
  selector:
    app: flag
  ports:
  - protocol: TCP
    port: 8002
    targetPort: 8002