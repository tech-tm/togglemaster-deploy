name: GitOps

on:
  push:
    branches:
      - deploy
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION || 'us-east-1' }}

jobs:
  secrets:
    name: Gitops Deploy
    uses: ./.github/workflows/secrets-sync.yml
    with:
      cluster_name: ''
      namespace: togglemaster
    secrets: inherit

  configmap:
    name: Create/Update ConfigMap with endpoints
    runs-on: ubuntu-latest
    needs: secrets
    steps:
      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get infrastructure endpoints
        id: endpoints
        run: |
          AUTH_EP=$(aws rds describe-db-instances --db-instance-identifier rds-postgres-auth --query "DBInstances[0].Endpoint.Address" --output text 2>/dev/null || echo "")
          FLAG_EP=$(aws rds describe-db-instances --db-instance-identifier rds-postgres-flag --query "DBInstances[0].Endpoint.Address" --output text 2>/dev/null || echo "")
          TARGET_EP=$(aws rds describe-db-instances --db-instance-identifier rds-postgres-targeting --query "DBInstances[0].Endpoint.Address" --output text 2>/dev/null || echo "")
          REDIS_EP=$(aws elasticache describe-cache-clusters --cache-cluster-id togglemaster-redis --show-cache-node-info --query "CacheClusters[0].CacheNodes[0].Endpoint.Address" --output text 2>/dev/null || echo "redis-endpoint-not-found")
          REGION="${{ env.AWS_REGION }}"

          echo "RDS_AUTH_ENDPOINT=$AUTH_EP" >> $GITHUB_ENV
          echo "RDS_FLAG_ENDPOINT=$FLAG_EP" >> $GITHUB_ENV
          echo "RDS_TARGETING_ENDPOINT=$TARGET_EP" >> $GITHUB_ENV
          echo "REDIS_ENDPOINT=$REDIS_EP" >> $GITHUB_ENV
          echo "AWS_ACCOUNT_ID=$ACCOUNT_ID" >> $GITHUB_ENV
          echo "AWS_REGION=$REGION" >> $GITHUB_ENV

      - name: Get cluster name from SSM
        run: |
          CLUSTER_NAME=$(aws ssm get-parameter --name "/togglemaster/prod/cluster-name" --query "Parameter.Value" --output text)
          echo "CLUSTER_NAME=$CLUSTER_NAME" >> $GITHUB_ENV

      - name: Setup kubeconfig
        run: |
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER_NAME"

      - name: Ensure namespace exists
        run: |
          kubectl create namespace togglemaster --dry-run=client -o yaml | kubectl apply -f -

      - name: Create or update ConfigMap with real values
        run: |
          kubectl create configmap togglemaster-config -n togglemaster \
            --from-literal=RDS_AUTH_ENDPOINT="$RDS_AUTH_ENDPOINT" \
            --from-literal=RDS_FLAG_ENDPOINT="$RDS_FLAG_ENDPOINT" \
            --from-literal=RDS_TARGETING_ENDPOINT="$RDS_TARGETING_ENDPOINT" \
            --from-literal=REDIS_ENDPOINT="$REDIS_ENDPOINT" \
            --from-literal=AWS_REGION="$AWS_REGION" \
            --from-literal=AWS_SQS_URL="https://sqs.$AWS_REGION.amazonaws.com/$AWS_ACCOUNT_ID/togglemaster-evaluation-events" \
            --from-literal=AWS_DYNAMODB_TABLE="ToggleMasterAnalytics" \
            --dry-run=client -o yaml | kubectl apply -f -
          
      - name: Restart deployments (if exist)
        run: |
          for DEPLOY in auth-service flag-service targeting-service evaluation-service analytics-service; do
            if kubectl get deployment "$DEPLOY" -n togglemaster &>/dev/null; then
              echo "Restarting $DEPLOY..."
              kubectl rollout restart deployment "$DEPLOY" -n togglemaster
            else
              echo "Deployment $DEPLOY not found. Skipping."
            fi
          done

  jobs:
    name: Apply DB Init Jobs
    runs-on: ubuntu-latest
    needs: [secrets, configmap]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get cluster name from SSM
        run: |
          CLUSTER_NAME=$(aws ssm get-parameter --name "/togglemaster/prod/cluster-name" --query "Parameter.Value" --output text)
          echo "CLUSTER_NAME=$CLUSTER_NAME" >> $GITHUB_ENV

      - name: Setup kubeconfig
        run: |
          aws eks update-kubeconfig --region "$AWS_REGION" --name "$CLUSTER_NAME"

      - name: Delete old db-init jobs (if exist)
        run: |
          kubectl delete job auth-db-init flag-db-init targeting-db-init -n togglemaster --ignore-not-found

      - name: Debug SQL files
        run: ls -la k8s/base/jobs/sql/auth/

      - name: Create SQL ConfigMaps from files
        run: |
          kubectl create configmap auth-init-sql -n togglemaster --from-file=k8s/base/jobs/sql/auth/init.sql --dry-run=client -o yaml | kubectl apply -f -
          kubectl create configmap flag-init-sql -n togglemaster --from-file=k8s/base/jobs/sql/flag/init.sql --dry-run=client -o yaml | kubectl apply -f -
          kubectl create configmap targeting-init-sql -n togglemaster --from-file=k8s/base/jobs/sql/targeting/init.sql --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply db-init jobs
        run: |
          kubectl apply -k k8s/base/jobs -n togglemaster