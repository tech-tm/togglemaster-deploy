name: Sync Kubernetes Secrets from SSM

on:
  workflow_call:
    inputs:
      cluster_name:
        description: 'Nome do cluster EKS'
        required: false
        type: string
        default: ''
      namespace:
        description: 'Namespace onde os secrets serão criados'
        required: false
        type: string
        default: 'togglemaster'
      region:
        description: 'Região AWS'
        required: false
        type: string
        default: 'us-east-1'

jobs:
  sync:
    name: Sync Secrets
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ inputs.region }}

      - name: Get cluster name from SSM (if not provided)
        id: cluster
        run: |
          if [ -z "${{ inputs.cluster_name }}" ]; then
            CLUSTER_NAME=$(aws ssm get-parameter --name "/togglemaster/prod/cluster-name" --query "Parameter.Value" --output text)
          else
            CLUSTER_NAME="${{ inputs.cluster_name }}"
          fi
          echo "cluster_name=$CLUSTER_NAME" >> $GITHUB_OUTPUT

      - name: Setup kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ inputs.region }} --name ${{ steps.cluster.outputs.cluster_name }}

      - name: Ensure namespace exists
        run: |
          kubectl create namespace ${{ inputs.namespace }} --dry-run=client -o yaml | kubectl apply -f -

      - name: Create individual database secrets
        run: |
          for service in auth flag targeting; do
            CREDS=$(aws ssm get-parameter --name "/togglemaster/prod/$service/credentials" --with-decryption --query "Parameter.Value" --output text)
            USERNAME=$(echo $CREDS | jq -r '.username')
            PASSWORD=$(echo $CREDS | jq -r '.password')
            kubectl create secret generic db-$service-secret -n ${{ inputs.namespace }} \
              --from-literal=username=$USERNAME \
              --from-literal=password=$PASSWORD \
              --dry-run=client -o yaml | kubectl apply -f -
          done

      - name: Create Redis secret
        run: |
          REDIS_CREDS=$(aws ssm get-parameter --name "/togglemaster/prod/redis/credentials" --with-decryption --query "Parameter.Value" --output text)
          REDIS_PASS=$(echo $REDIS_CREDS | jq -r '.password')
          kubectl create secret generic redis-secret -n ${{ inputs.namespace }} \
            --from-literal=password=$REDIS_PASS \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create combined secret togglemaster-secrets
        run: |
          # Credenciais dos bancos
          AUTH_CREDS=$(aws ssm get-parameter --name "/togglemaster/prod/auth/credentials" --with-decryption --query "Parameter.Value" --output text)
          AUTH_USER=$(echo $AUTH_CREDS | jq -r '.username')
          AUTH_PASS=$(echo $AUTH_CREDS | jq -r '.password')

          FLAG_CREDS=$(aws ssm get-parameter --name "/togglemaster/prod/flag/credentials" --with-decryption --query "Parameter.Value" --output text)
          FLAG_USER=$(echo $FLAG_CREDS | jq -r '.username')
          FLAG_PASS=$(echo $FLAG_CREDS | jq -r '.password')

          TARGET_CREDS=$(aws ssm get-parameter --name "/togglemaster/prod/targeting/credentials" --with-decryption --query "Parameter.Value" --output text)
          TARGET_USER=$(echo $TARGET_CREDS | jq -r '.username')
          TARGET_PASS=$(echo $TARGET_CREDS | jq -r '.password')

          REDIS_CREDS=$(aws ssm get-parameter --name "/togglemaster/prod/redis/credentials" --with-decryption --query "Parameter.Value" --output text)
          REDIS_PASS=$(echo $REDIS_CREDS | jq -r '.password')

          # Chaves específicas do evaluation (criadas via Terraform)
          MASTER_KEY=$(aws ssm get-parameter --name "/togglemaster/prod/evaluation/master_key" --with-decryption --query "Parameter.Value" --output text 2>/dev/null || echo "default-master-key")
          SERVICE_API_KEY=$(aws ssm get-parameter --name "/togglemaster/prod/evaluation/service_api_key" --with-decryption --query "Parameter.Value" --output text 2>/dev/null || echo "default-service-api-key")

          # POSTGRES_USER e POSTGRES_PASSWORD (usaremos as mesmas do auth)
          POSTGRES_USER=$AUTH_USER
          POSTGRES_PASSWORD=$AUTH_PASS

          kubectl create secret generic togglemaster-secrets -n ${{ inputs.namespace }} \
            --from-literal=AUTH_USER=$AUTH_USER \
            --from-literal=AUTH_PASSWORD=$AUTH_PASS \
            --from-literal=FLAG_USER=$FLAG_USER \
            --from-literal=FLAG_PASSWORD=$FLAG_PASS \
            --from-literal=TARGET_USER=$TARGET_USER \
            --from-literal=TARGET_PASSWORD=$TARGET_PASS \
            --from-literal=REDIS_PASSWORD=$REDIS_PASS \
            --from-literal=POSTGRES_USER=$POSTGRES_USER \
            --from-literal=POSTGRES_PASSWORD=$POSTGRES_PASSWORD \
            --from-literal=MASTER_KEY=$MASTER_KEY \
            --from-literal=SERVICE_API_KEY=$SERVICE_API_KEY \
            --dry-run=client -o yaml | kubectl apply -f -