name: Sync Datadog Secret from SSM

# ----------------------------------------------------------------------
# Cria o Secret `datadog-secret` no namespace `observability` a partir
# de parametros do AWS SSM Parameter Store:
#   /togglemaster/prod/datadog/api-key   (SecureString) - obrigatorio
#   /togglemaster/prod/datadog/site      (String)       - opcional
#                                                        (default: datadoghq.com)
#
# Esse secret e consumido pelo OTel Collector (exporter datadog) para
# enviar traces, metricas e logs ao Datadog.
# ----------------------------------------------------------------------

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      cluster_name:
        description: 'Nome do cluster EKS'
        required: false
        type: string
        default: ''
      namespace:
        description: 'Namespace onde o secret sera criado'
        required: false
        type: string
        default: 'observability'
      region:
        description: 'Regiao AWS'
        required: false
        type: string
        default: 'us-east-1'

jobs:
  sync:
    name: Sync Datadog Secret
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ inputs.region || 'us-east-1' }}

      - name: Resolve cluster name
        id: cluster
        run: |
          if [ -z "${{ inputs.cluster_name }}" ]; then
            CLUSTER_NAME=$(aws ssm get-parameter --name "/togglemaster/prod/cluster-name" --query "Parameter.Value" --output text)
          else
            CLUSTER_NAME="${{ inputs.cluster_name }}"
          fi
          echo "cluster_name=$CLUSTER_NAME" >> $GITHUB_OUTPUT

      - name: Setup kubeconfig
        run: |
          aws eks update-kubeconfig --region ${{ inputs.region || 'us-east-1' }} --name ${{ steps.cluster.outputs.cluster_name }}

      - name: Ensure namespace exists
        run: |
          kubectl create namespace ${{ inputs.namespace || 'observability' }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Create datadog-secret
        run: |
          DD_API_KEY=$(aws ssm get-parameter \
            --name "/togglemaster/prod/datadog/api-key" \
            --with-decryption \
            --query "Parameter.Value" \
            --output text)

          DD_SITE=$(aws ssm get-parameter \
            --name "/togglemaster/prod/datadog/site" \
            --query "Parameter.Value" \
            --output text 2>/dev/null || echo "datadoghq.com")

          kubectl create secret generic datadog-secret \
            -n ${{ inputs.namespace || 'observability' }} \
            --from-literal=api-key="$DD_API_KEY" \
            --from-literal=site="$DD_SITE" \
            --dry-run=client -o yaml | kubectl apply -f -

          echo "Secret datadog-secret sincronizado (site=$DD_SITE)."
